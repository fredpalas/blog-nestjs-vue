# Entorno local. En Podium no se usa: allí el chart despliega la imagen de
# cada servicio por separado y la base de datos todavía no existe por tenant
# (ver README).
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "!ChangeMe!"
      POSTGRES_DB: app
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres arranca vacío: el esquema lo crean las migraciones y los
      # datos el seeder, al arrancar la API (ver api/src/main.ts).
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database_data:
