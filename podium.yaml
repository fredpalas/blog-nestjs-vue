# Declaración de servicios para Podium.
#
# Cada clave de primer nivel es un serviceName. Este repo declara dos, así que
# Podium descubre ambos y despliega cada uno como su propia Application, con el
# mismo hash de proyecto:
#
#   api  ->  api-{hash}.apperture.dev
#   web  ->  web-{hash}.apperture.dev
#
# El frontend no recibe la URL de la API por configuración: la deriva de su
# propio hostname sustituyendo el prefijo `web-` por `api-` (ver
# web/src/lib/api.ts). Así no depende de variables de entorno en el build, que
# Podium todavía no inyecta.

api:
  src: api
  lang: nodejs
  framework: nestjs
  environment:
    NODE_ENV: production
  # Podium monta un Cluster de CNPG para este servicio e inyecta sus
  # credenciales en las variables que se piden aquí. No se declaran valores:
  # se declara *dónde* quiere la aplicación recibir cada dato. Las contraseñas
  # las genera CNPG y viajan por secretKeyRef — Podium no las ve.
  #
  # Los nombres coinciden con los que ya lee api/src/mikro-orm.config.ts, y el
  # esquema y los datos los crea la propia aplicación al arrancar (migraciones
  # + seeder, ver api/src/main.ts): un tenant no tiene forma de ejecutar
  # comandos aparte.
  database:
    enable: true
    database: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    host: ${DB_HOST}
    port: ${DB_PORT}

web:
  src: web
  lang: nodejs
  framework: vue
  environment:
    NODE_ENV: production
